<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskForge</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <h1 class="text-4xl font-bold text-center">TaskForge</h1>
            <div class="search-box">
                <form>
                    <label for="search">Search</label>
                    <input id="search" name="search" type="search" placeholder="Search tasks...">
                    <div class="filters">
                        <select id="status-filter">
                            <option value="all">All Status</option>
                            <option value="todo">TODO</option>
                            <option value="doing">DOING</option>
                            <option value="done">DONE</option>
                        </select>

                        <select id="priority-filter">
                            <option value="all">All Priority</option>
                            <option value="low">LOW</option>
                            <option value="medium">MEDIUM</option>
                            <option value="high">HIGH</option>
                        </select>
                    </div>
                </form>
            </div>
        </nav>
    </header>
    <main>
        <div id="app-state"></div>
        <div class="task-board">
            <section class="task-column" data-status="todo">
                <h2>TODO</h2>
                <div class="task-list"></div>
            </section>
            <section class="task-column" data-status="doing">
                <h2>DOING</h2>
                <div class="task-list"></div>
            </section>
            <section class="task-column" data-status="done">
                <h2>DONE</h2>
                <div class="task-list"></div>
            </section>
        </div>
        <div class="input-box">
            <form id="task-form">

                <h2>Add Task</h2>

                <label for="task-name">Task Name</label>
                <input type="text" id="task-name" name="taskName" placeholder="What needs to be done?" required>

                <label for="task-status">Status</label>
                <select name="status" id="task-status">
                    <option value="todo">TODO</option>
                    <option value="doing">DOING</option>
                    <option value="done">DONE</option>
                </select>

                <label for="task-priority">Priority</label>
                <select name="priority" id="task-priority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                </select>

                <div id="deadline-field" class="deadline-field" hidden>
                    <label for="task-deadline">Deadline</label>
                    <input type="datetime-local" id="task-deadline" name="deadline">
                </div>

                <button type="submit" id="add-task-btn">Add Task</button>


            </form>
        </div>
    </main>
    <footer>
        <p>TaskForge — Built with Vanilla JavaScript</p>
    </footer>

    <script type="module" src="src/main.js"></script>
</body>

</html>
