<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskForge</title>

<body class="bg-gray-100 text-gray-800 font-bold-md min-h-screen">

    <main class="flex-1 flex flex-col min-w-0 ">
        <!-- Top Application Bar -->
        <header class="sticky top-0 z-20 h-16 bg-white border-b flex items-center justify-between px-6 no shadows">
            <div class="flex items-center">
                <span class="font-headline-md text-headline-md font-bold text-primary">TaskForge</span>
            </div>
            <!-- Search Bar -->
            <div class="search-box hidden md:flex  flex-1 max-w-2xl mx-auto relative items-center">
                <span class="material-symbols-outlined absolute left-sm text-on-surface-variant"
                    data-icon="search">🔎</span>
                <input
                    class="pl-xl pr-lg py-2 border rounded-lg  focus:outline-none focus:ring-2 font-body-sm transition-shadow shadow-sm w-full  bg-surface-container-lowest  border-outline-variant  "
                    id="search" name="search" type="search" placeholder="Search tasks, projects...">

            </div>
        </header>
        <!-- Dashboard Header & Filters -->
        <div class="pt-5 pb-md px-margin-desktop">
            <div class=" flex justify-between items-center">
                <div>
                    <h1
                        class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface font-bold tracking-tight">
                        Project Board</h1>
                    <p class="font-body-md text-body-md">Manage tasks and track progress for active sprint.</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <div
                        class="p-1 flex items-center gap-unit bg-surface-container-low border border-outline-variant rounded-lg">
                        <span class="font-body-sm text-body-sm text-on-surface-variant pl-sm font-medium">Status:</span>
                        <select id="status-filter"
                            class="bg-transparent border-none font-body-sm text-body-sm text-on-surface py-1 pr-xl pl-2 focus:ring-0 cursor-pointer">
                            <option value="all">All Status</option>
                            <option value="todo">TODO</option>
                            <option value="doing">DOING</option>
                            <option value="done">DONE</option>
                        </select>
                    </div>

                    <div
                        class="p-1 flex items-center gap-unit bg-surface-container-low border border-outline-variant rounded-lg">
                        <span
                            class="font-body-sm text-body-sm text-on-surface-variant pl-sm font-medium">Priority:</span>
                        <select id="priority-filter"
                            class="bg-transparent border-none font-body-sm text-body-sm text-on-surface py-1 pr-xl pl-2 focus:ring-0 cursor-pointer">
                            <option value="all">All Priority</option>
                            <option value="low">LOW</option>
                            <option value="medium">MEDIUM</option>
                            <option value="high">HIGH</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div id="app-state"></div>
        <!-- Kanban Board -->
        <div class=" max-w-5xl  task-board flex justify-center gap-md pb-md h-[calc(100vh-220px)]">
            <section
                class="task-column w-80 flex flex-col items-start  bg-surface-bright border border-outline-variant rounded-lg h-full max-h-full"
                data-status="todo">
                <div class="flex items-center justify-between p-4 w-full border-b border-outline-variant">
                    <h2 class="font-headline-sm text-headline-sm font-bold text-on-surface flex items-center gap-sm">
                        <div class="w-2 h-2 rounded-full bg-outline"></div>
                        To Do
                    </h2>
                    <span
                        class="font-label-code text-label-code bg-surface-container text-on-surface-variant px-2 py-0.5 rounded">3</span>

                </div>
                <div class="task-list w-full flex-1 p-2 flex flex-col gap-3 overflow-y-auto"></div>
            </section>
            <section

                        DOING
                    </h2>
                    <span
                        class="font-label-code text-label-code bg-surface-container text-on-surface-variant px-2 py-0.5 rounded">3</span>

                </div>

            </section>
            <section
                class="task-column w-80 flex flex-col items-start  bg-surface-bright border border-outline-variant rounded-lg h-full max-h-full"
                data-status="done">
                <div class="flex items-center justify-between p-4 w-full border-b border-outline-variant">
                    <h2 class="font-headline-sm text-headline-sm font-bold text-on-surface flex items-center gap-sm">
                        <div class="w-2 h-2 rounded-full bg-outline"></div>
                        DONE
                    </h2>
                    <span
                        class="font-label-code text-label-code bg-surface-container text-on-surface-variant px-2 py-0.5 rounded">3</span>

                </div>
                <div class="task-list w-full flex-1 p-2 flex flex-col gap-3 overflow-y-auto"></div>
            </section>
        </div>
        <button id="open-task-modal"
            class="mt-auto mb-lg w-full bg-primary text-on-primary font-body-md font-bold py-2 px-4 rounded-lg hover:scale-[0.98] transition-transform flex items-center justify-center gap-sm max-w-4xl">
            Add Task
        </button>
        <div class="input-box">
            <form id="task-form">

                <h2>Add Task</h2>

                <label for="task-name">Task Name</label>
                <input type="text" id="task-name" name="taskName" placeholder="What needs to be done?" required>

                <label for="task-status">Status</label>
                <select name="status" id="task-status">
                    <option value="todo">TODO</option>
                    <option value="doing">DOING</option>
                    <option value="done">DONE</option>
                </select>

                <label for="task-priority">Priority</label>
                <select name="priority" id="task-priority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                </select>

                <div id="deadline-field" class="deadline-field" hidden>
                    <label for="task-deadline">Deadline</label>
                    <input type="datetime-local" id="task-deadline" name="deadline">
                </div>

                <button type="submit" id="add-task-btn">AddTask</button>


            </form>

        </div>
        <div id="task-modal" class="hidden fixed  inset-0 bg-black/50  justify-center items-center">

            <form id="task-form" class="bg-white rounded-xl p-6 w-[50%]  h-[50%] flex flex-col ">
                <h2 class="font-headline-lg font-bold">
                    Create Task
                </h2>
                <label for="task-name">Task Name</label>
                <input type="text" id="task-name" class="border rounded-lg p-2 w-full mb-4" name="taskName"
                    placeholder="What needs to be done?" required>
                <label for="task-name">info</label>
                <input type="text" id="task-name" class="border rounded-lg p-2 w-full h-full mb-4" name="taskName"
                    placeholder="">

                <div class="flex gap-3 mt-auto items-center px-2">
                    <div>
                        <label for="task-status">Status:</label>
                        <select name="status" id="task-status">
                            <option value="todo">TODO</option>
                            <option value="doing">DOING</option>
                            <option value="done">DONE</option>
                        </select>
                    </div>

                    <div>
                        <label for="task-priority">Priority:</label>
                        <select name="priority" id="task-priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>

                    <div id="deadline-field" class="deadline-field" hidden>
                        <label for="task-deadline">Deadline</label>
                        <input type="datetime-local" id="task-deadline" name="deadline">
                    </div>

                    <button type="submit" id="open-task-modal"
                        class="relative ml-auto mt-auto  bg-primary text-on-primary font-body-md  py-2 px-4 rounded-lg hover:scale-[0.98] transition-transform flex items-center justify-center gap-sm max-w-4xl">Add
                        Task</button>
                </div>

            </form>
        </div>
    </main>
    <footer>
        <p>TaskForge — Built with Vanilla JavaScript</p>
    </footer>
