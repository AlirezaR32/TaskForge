<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskForge</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <h1>My Projects</h1>
            <div class="search-box">
                <label for="search">Search Task</label>
                <form>
                    <input id="search" name="search" type="search" placeholder="Search tasks...">
                </form>
            </div>
        </nav>
    </header>
    <main>
        <div class="task-board">
            <section class="task-column" data-status="todo">
                <h2>TODO</h2>
                <div class="task-list"></div>
            </section>
            <section class="task-column" data-status="doing">
                <h2>DOING</h2>
                <div class="task-list"></div>
            </section>
            <section class="task-column" data-status="done">
                <h2>DONE</h2>
                <div class="task-list"></div>
            </section>
        </div>
        <div>
            <button type="button" id="add-task-btn">Add task</button>
        </div>
    </main>
    <footer></footer>

    <script src="src/main.js"></script>
</body>

</html>
