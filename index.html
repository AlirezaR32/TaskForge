<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskForge</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <h1>My Projects</h1>
            <div class="search-box">
                <form>
                    <label for="search">Search Task</label>
                    <input id="search" name="search" type="search" placeholder="Search tasks...">
                </form>
            </div>
        </nav>
    </header>
    <main>
        <div class="task-board">
            <section class="task-column" data-status="todo">
                <h2>TODO</h2>
                <div class="task-list"></div>
            </section>
            <section class="task-column" data-status="doing">
                <h2>DOING</h2>
                <div class="task-list"></div>
            </section>
            <section class="task-column" data-status="done">
                <h2>DONE</h2>
                <div class="task-list"></div>
            </section>
        </div>
        <div>
            <form id="task-form">

                <h2>Add Task</h2>
                
                <label for="taskName">task name</lable>
                    <input type="text" id="task-name" name="taskName" placeholder="task name" required>

                    <label for="status">Status</label>
                    <select name="status" id="task-status">
                        <option value="todo">todo</option>
                        <option value="doing">doing</option>
                        <option value="done">done</option>
                    </select>

                    <label for="priority">Priority</label>
                    <select name="priority" id="task-priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                    <button type="submit" id="add-task-btn">Add task</button>

            </form>
        </div>
    </main>
    <footer></footer>

    <script type="module" src="src/main.js"></script>
</body>

</html>
